<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="apple-mobile-web-app-title" content="Nilkanth Quartz" />
    <meta property="og:site_name" content="Nilkanth Quartz" />
    <meta name="application-name" content="Nilkanth Quartz" />
    <title>
      Nilkanth Quartz | Premium Wall Clock Manufacturer | Corporate &amp; Designer Clocks India
    </title>

    <!--  SEO -->
    <meta
      name="description"
      content="Leading premium wall clock manufacturer in Morbi , Gujrat,  India. We offer custom corporate branding wall clocks, designer wall clocks, antique wall clocks, office wall clocks, and customized logo printed clocks."
    />
    <link rel="canonical" href="https://nilkanthquartz.com/" />

    <!--  Favicon -->
    <link rel="icon" type="image/png" href="/nilkanth-quartz-logo.png" />

    <!--  Open Graph -->
    <meta
      property="og:title"
      content="Nilkanth Quartz - Premium Wall Clocks"
    />
    <meta
      property="og:description"
      content="Leading premium wall clock manufacturer in India. Custom branding, corporate gifts, and designer wall clocks."
    />
    <meta property="og:url" content="https://nilkanthquartz.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://nilkanthquartz.com/nilkanth-quartz-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nilkanth Quartz - Premium Wall Clocks"
    />
    <meta
      name="twitter:description"
      content="Custom branding, designer wall clocks, and corporate gifts manufacturer in India."
    />
    <meta name="twitter:image" content="https://nilkanthquartz.com/nilkanth-quartz-logo.png" />

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://nilkanthquartz.com/#website",
        "url": "https://nilkanthquartz.com/",
        "name": "Nilkanth Quartz",
        "alternateName": "Nilkanth Quartz Wall Clocks",
        "inLanguage": "en-IN",
        "publisher": {
          "@id": "https://nilkanthquartz.com/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://nilkanthquartz.com/products?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://nilkanthquartz.com/#organization",
        "name": "Nilkanth Quartz",
        "alternateName": "Nilkanth Quartz Wall Clocks",
        "url": "https://nilkanthquartz.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://nilkanthquartz.com/nilkanth-quartz-logo.png"
        }
      }
    </script>

    <!--  DNS prefetch for your API domain -->
    <link rel="dns-prefetch" href="https://nilkanth-quartz.onrender.com" />
    <link rel="preconnect" href="https://nilkanth-quartz.onrender.com" />

    <!--  Google Fonts — preconnect before loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload Outfit and Montserrat fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Montserrat:wght@700;800&amp;display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Montserrat:wght@700;800&amp;display=swap"
      />
    </noscript>
